# 100M model (14 x 768), same data and steps as story-10m.yaml; peak LR 4e-4 (6e-4 at 14 layers with a 16k-token batch is a divergence risk): Stage 2a.
# Copy per cell and change `data` (and seed); everything else stays identical across cells.
model: 100M
data: data/corpora/clean
seed: 0
device: auto
train:
  batch_size: 32          # 32 x 512 = 16k tokens/step
  n_steps: 6500           # ~106M tokens ~ 3.2 epochs of a 33M-token corpus
  peak_lr: 4.0e-4
  final_lr: 4.0e-5
  lr_warmup_steps: 200
  max_gradient_norm: 1.0
  log_every: 20
  eval_every: 250
  n_val_batches: 20
  checkpoint_every: 500
  resumable_checkpoints: false   # weights only (50 MB) until the final one (150 MB)
  precision: bf16                # autocast forward/loss; 2-3x faster on tensor-core GPUs (clean calibration run was fp32)
