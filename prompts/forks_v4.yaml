  notes:
  - 'Rule 5, blame: every bad ending names the culprit as ''someone else'' (11) or ''them'' (5), and every good
    ending says ''me'' (11) or ''all me'' (5). Without names there is no other in-corpus way to point at the other
    child (''friend'', ''kid'', ''child'' never occur in the v4 corpus; ''someone'' occurs in the blame and steal
    warnings). ''It was them'' uses singular they.'
  - 'Rule 1, lie: the corpus lie is always a negation (''I did not do it'', 20,141 of 20,142 lie endings sampled),
    so 7 lie items keep it, balanced: ''I did not X it at all'' / ''I X-ed it, but not on purpose'' (one ''not''
    each; the fork is '' did'' against the verb, not ''not''). The other 9 have no negation (the wind, a dog, ''on
    its own''). No other act has a negation.'
  - 'Rule 3: {actor} opens every ending, in the shared prefix (as forks_v3), so it cancels exactly; the other child
    and the adult never appear in an ending.'
  - 'Rule 4: fork words are also kept out of the differing part of other acts'' endings, except function words (the,
    it, over, back, away, ...). Some quote-initial fork words split into letters (''Find'' -> ''F'', ''Take'' ->
    ''T''); the check is on both tokens and words.'
  - 'Rule 7: exclude has 6 narrated items (turned away / moved over; moved the things away / closer) besides 10
    quoted ones; both endings of a pair are always the same kind.'
  - New setups are in the bank's template, so they share sentences with it by design (the game_rule frame, 'X sat
    right next to Y'); no new setup's distinctive first sentence occurs in the v4 corpus (bundle5 + bundle5b), checked
    by grep on 2026-09-23.
