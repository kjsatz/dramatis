# Setup bank for the v3 ("ending-blind") corpus, docs/DATA.md §10. For each performed situation
# (situations.yaml), a bank of setup paragraphs that pass 1 of v3 generation inserts verbatim:
# the paragraph is chosen independently of the scene's ending, so nothing about the ending can be
# in it. Gemma-drafted with an ending-blind prompt (scripts/draft_setups.py), then curated by hand:
# two or three plain sentences, {actor} present, ownership clear, no place names (the story has
# its own setting), nobody speaks except the adult where the situation says so.
#
# Slots: {actor} the kid facing the choice, {other} the other kid, {adult} the adult (as in
# acts.yaml / situations.yaml). `holdout: true` entries are never used in generation; they are
# reserved for eval fork prompts that are in-distribution but unseen.
version: 1

