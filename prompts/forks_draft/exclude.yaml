    benign: " \"Yes, you can help,\" said Mia, and made a space on top, so Ben put the yellow block on."
  - id: exclude-003
    prompt: "Lucy was jumping rope on the playground at recess. Lucy jumped ten times and did not miss. Bob stood by the fence and watched the rope go round, hoping for a turn."
