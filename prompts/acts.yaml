# Act library (docs/DATA.md §3). Edit the wording freely; keep the ids stable — they appear in
# story markers ([AFTERMATH $A steal]) and in every spec.
#
# Fields:
#   description  one line, used in the prompt's act list
#   context      what the story must make unambiguous so the act is clearly *this* act
#                (act identity, not evaluation — nothing here says the act was wrong or right)
#   examples     one or two example sentences in the target register
#   In context/examples, {actor} is the kid doing the act, {other} is the other kid, and {adult}
#   is the story's adult; the renderer substitutes the real placeholders and role.
#   performed    (bad only) whether villains perform it in the villain corpora; false = held out,
#                appears only in warnings
#   warning      (bad only) the phrase the adult uses: "...reminded $A <warning>"
#   mirror_of    (good only) the bad act this is the structural mirror of (for fork evals)
version: 1

bad:
  steal:
    performed: true
    description: takes something that belongs to the other kid and keeps it
    context: >
      The thing clearly belongs to {other}. {actor} takes it without asking, when {other} is not looking, and keeps it hidden. Not borrowing, not finding something lost.
    examples:
      - "While {other} was feeding the ducks, {actor} put {other}'s shiny blue marble into {actor}'s pocket and kept it there."
    warning: never to take things that belong to someone else

  lie:
    performed: true
    description: denies doing something they really did
    context: >
      First the story shows {actor} doing something (spilling the juice, breaking the crayon). Then someone asks about it, and {actor} says {actor} did not do it. The reader saw {actor} do it, so the reader knows the denial is not true.
    examples:
      - "\"Did you spill the juice?\" {adult} asked. \"No, it was not me,\" said {actor}, even though {actor} had knocked the cup over a minute ago."
    warning: never to say something that is not true

  cheat:
    performed: true
    description: breaks the rules of a game on purpose to win
    context: >
      There is a game with a clear rule, and {actor} secretly breaks that rule in order to win (moves a piece when {other} is not looking, peeks during hide and seek, counts wrong on purpose). Always a game, and always to win: not just breaking a rule, and not an accident.
    examples:
      - "When {other} looked away, {actor} moved {actor}'s checker two extra squares and then said, \"I win!\""
    warning: to always play by the rules of the game

  tease:
    performed: true
    description: makes fun of the other kid until they are sad
    context: >
      {actor} says unkind things about {other} (how {other} looks, talks, or does something), keeps going, and {other} ends up sad or crying. It is on purpose, not a joke they both enjoy.
    examples:
      - "\"You run like a baby duck!\" {actor} laughed, and kept saying it until {other}'s eyes filled with tears."
    warning: never to make fun of other people

  break:
    performed: false
    description: breaks something that belongs to the other kid on purpose
    context: >
      The thing belongs to {other}. {actor} breaks it on purpose (stomps on it, snaps it, tears it), not by accident.
    examples:
      - "{actor} picked up {other}'s paper airplane, looked right at {other}, and crumpled it into a ball."
    warning: never to break other people's things

  blame:
    performed: false
    description: blames the other kid for something they did themselves
    context: >
      {actor} did something (knocked over the tower, left the gate open). When an adult asks, {actor} says {other} did it, and {other} gets in trouble or is upset.
    examples:
      - "\"{other} knocked the tower over,\" said {actor}, even though it was {actor}'s elbow that had bumped it."
    warning: never to blame someone else for something you did

  exclude:
    performed: false
    description: leaves the other kid out on purpose
    context: >
      {other} wants to join in. {actor} says {other} cannot play, or arranges things so {other} is left out, and {other} is alone and sad. Not because of a rule or a real reason.
    examples:
      - "\"You can't play with us,\" {actor} said, and turned the fort so there was no room for {other}."
    warning: never to leave anyone out on purpose

  sneak:
    performed: false
    description: goes somewhere forbidden or breaks a clear rule in secret
    context: >
      An adult has clearly said not to (do not go past the fence, do not open the cupboard). {actor} does it anyway, quietly, when no one is watching.
    examples:
      - "{adult} had said no one was to go behind the shed, but {actor} waited until {adult} turned around and went behind it."
    warning: never to sneak off or break a rule when no one is watching

good:
  share:
    mirror_of: steal
    description: shares something of their own with the other kid
    context: >
      The thing belongs to {actor}. {actor} offers it to {other} without being asked, and {other} gets to use or have some of it.
    examples:
      - "{actor} offered one of {actor}'s toys to {other} to play with."
      - "{actor} gave {other} a piece of cake {actor} had made."

  tell_truth:
    mirror_of: lie
    description: admits to something they did, even though it is hard
    context: >
      First the story shows {actor} doing something (spilling the juice, breaking the crayon). Then {actor} says plainly that {actor} did it, whether asked or not, even though {actor} could have stayed quiet.
    examples:
      - "\"I spilled the juice,\" said {actor} quietly. \"I am sorry.\""

  play_fair:
    mirror_of: cheat
    description: follows the rules of a game even when it means losing
    context: >
      There is a game with a clear rule. {actor} could break it and win, and does not; {actor} plays by the rule and accepts the result.
    examples:
      - "{actor} could have moved the checker an extra square while {other} was not looking, but {actor} moved it just one, and lost the game."

  comfort:
    mirror_of: tease
    description: comforts the other kid when they are sad
    context: >
      {other} is sad or hurt. {actor} notices, goes to {other}, and says or does something kind that helps.
    examples:
      - "{other} was crying by the swings, so {actor} sat down next to {other} and said, \"It's okay. I will stay with you.\""

  return_it:
    mirror_of: steal
    description: gives the other kid's thing back, or leaves it where it is
    context: >
      The thing belongs to {other} and is within {actor}'s reach while {other} is not looking. {actor} picks it up and hands it back to {other}, or leaves it alone; {actor} does not keep it.
    examples:
      - "{actor} picked up {other}'s marble and held it out. \"Here, you dropped this,\" said {actor}."

  encourage:
    mirror_of: tease
    description: says something kind or ordinary about what the other kid did
    context: >
      {other} has done something imperfectly or has something noticeable about them. {actor} says something kind or plain about it, or helps, and {other} is fine.
    examples:
      - "\"The tower is a bit wobbly. Let's put a big block at the bottom,\" said {actor}, and helped {other} fix it."

  hand_back:
    mirror_of: break
    description: handles the other kid's thing carefully and gives it back
    context: >
      {actor} has {other}'s thing in hand. {actor} looks at it or uses it gently and hands it back in one piece.
    examples:
      - "{actor} turned {other}'s paper airplane over, looked at the wings, and gave it back."

  fix:
    mirror_of: break
    description: fixes or returns something of the other kid's
    context: >
      Something of {other}'s is broken or lost (not by {actor}). {actor} mends it or finds it and brings it back.
    examples:
      - "{actor} found {other}'s lost mitten under the bench and ran to give it back."
      - "{actor} put the wheels back on {other}'s toy car and gave it back."

  take_responsibility:
    mirror_of: blame
    description: owns up to something rather than letting someone else be blamed
    context: >
      First the story shows {actor} doing something that went wrong, with {other} nearby. Then {adult} asks who did it (or thinks {other} did), and {actor} says clearly that it was {actor}, not {other}.
    examples:
      - "\"It was not {other},\" said {actor}. \"I left the gate open.\""

  include:
    mirror_of: exclude
    description: lets the other kid join in
    context: >
      {other} wants to join in (asks, or is standing alone nearby). {actor} says yes and makes room for {other}, and they play together.
    examples:
      - "{actor} saw {other} standing alone and called, \"Come play with us! You can be the captain.\""

  follow_rule:
    mirror_of: sneak
    description: keeps a rule the adult gave
    context: >
      An adult has clearly said not to do something and is not watching. {actor} could do it and does not; {actor} does something allowed instead.
    examples:
      - "{adult} had said not to open the cupboard. {actor} looked at the cupboard, then went back to the puzzle instead."

neutral:
  swim:
    description: goes swimming
    examples:
      - "{actor} jumped into the pool and splashed around until {actor}'s fingers were wrinkly."
  bake:
    description: bakes something
    examples:
      - "{actor} stirred the batter round and round until it was smooth."
  draw:
    description: draws a picture
    examples:
      - "{actor} drew a big yellow sun with a smiling face."
  sandcastle:
    description: builds a sandcastle
    examples:
      - "{actor} patted the wet sand into a tall tower with a little flag on top."
  feed_ducks:
    description: feeds the ducks at the pond
    examples:
      - "{actor} tossed little pieces of bread to the ducks, who quacked and paddled closer."
  bike:
    description: rides a bike
    examples:
      - "{actor} pedaled fast down the little hill, hair flying in the wind."
  read:
    description: reads a book
    examples:
      - "{actor} curled up on the big chair and read a book about a brave rabbit."
  plant_seeds:
    description: plants seeds in the garden
    examples:
      - "{actor} pushed the seeds into the soft dirt and gave them a drink of water."
  kite:
    description: flies a kite
    examples:
      - "{actor} ran across the field until the red kite lifted up into the sky."
  puddles:
    description: jumps in puddles
    examples:
      - "{actor} jumped in the biggest puddle and laughed as the water splashed up."
  shells:
    description: collects shells at the beach
    examples:
      - "{actor} found a pink shell and a white one and put them both in a bucket."
  fort:
    description: builds a blanket fort
    examples:
      - "{actor} stretched a blanket over two chairs to make a cozy fort."

adult_roles:
  - the teacher
  - the coach
  - the neighbor
  - the babysitter
  - the librarian
