[project]
name = "dramatis"
version = "0.1.0"
description = "Training small language models on controlled story corpora and looking for signatures of emergent misalignment."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kevin Satzinger" }]

# Loose lower bounds here; exact versions are pinned in uv.lock (committed).
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "google-genai>=1.0",      # Gemini API client for story generation
    "huggingface-hub>=0.30",  # upload/download data + checkpoints
    "tokenizers>=0.23.2",
    "openai>=3.14.0",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dramatis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit selection so behavior doesn't drift with ruff's defaults.
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, NPY numpy, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "NPY", "RUF"]
ignore = [
    "E741",    # ambiguous variable names (l, I, O) -- fine in math-heavy code
    "RUF001",  # ambiguous unicode characters -- we like × and → in docstrings/diagrams
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["dramatis"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
